# Zie docs/argocd.md (zelfbeheer, bootstrap, break-glass).
# Elke 12u verse shoot-kubeconfigs (token-TTL is 24u; 2x marge).
# Gebruikt bootstrap-secret gardener-sa-kubeconfig. Zie docs/argocd.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: argocd-credential-refresh
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 3
      template:
        metadata:
          labels:
            app: argocd-credential-refresh
        spec:
          containers:
          - command:
            - /bin/sh
            - /scripts/refresh.sh
            # Zelfverlenging van het Gardener-token; defaults staan ook in
            # refresh.sh, hier expliciet zodat ze zichtbaar en te draaien
            # zijn zonder de ConfigMap te lezen. 2160h = 90d is het
            # maximum dat Gardener uitgeeft.
            env:
            - name: GARDENER_SA
              value: argocd-automation
            - name: RENEW_BEFORE_DAYS
              value: "30"
            - name: TOKEN_DURATION
              value: 2160h
            image: alpine/k8s:1.29.2
            imagePullPolicy: IfNotPresent
            name: refresh
            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
            volumeMounts:
            - mountPath: /scripts
              name: scripts
              readOnly: true
            - mountPath: /gardener-sa
              name: gardener-sa
              readOnly: true
          dnsPolicy: ClusterFirst
          # Never i.p.v. OnFailure: bij OnFailure ruimt de job-controller de
          # pod op zodra backoffLimit is bereikt, en dan zijn de logs van de
          # storing weg (aangetoond 2026-08-10). Met Never blijven de falende
          # pods staan tot failedJobsHistoryLimit ze opruimt.
          restartPolicy: Never
          schedulerName: default-scheduler
          securityContext: {}
          serviceAccount: argocd-credential-refresh
          serviceAccountName: argocd-credential-refresh
          terminationGracePeriodSeconds: 30
          volumes:
          - configMap:
              defaultMode: 493
              name: argocd-credential-refresh-script
            name: scripts
          - name: gardener-sa
            secret:
              defaultMode: 420
              items:
              - key: kubeconfig
                path: kubeconfig
              secretName: gardener-sa-kubeconfig
  schedule: 0 */12 * * *
  successfulJobsHistoryLimit: 3
  suspend: false
