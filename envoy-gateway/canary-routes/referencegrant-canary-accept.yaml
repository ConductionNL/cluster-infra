---
# Staat de gedeelde Gateway toe het bestaande TLS-secret van de
# canary-Nextcloud te lezen. Read-only en naam-gescoped: alleen
# nextcloud-canary-accept-tls, niet elk Secret in deze namespace.
#
# De nginx-Ingress in canary-accept blijft hetzelfde Secret gebruiken. Dat is
# opzet: cert-manager vernieuwt het via HTTP-01 over die Ingress, en zolang de
# DNS van deze host niet verhuist blijft die vernieuwing werken.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: gateway-to-nextcloud-tls
  namespace: canary-accept
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: envoy-gateway-system
  to:
    - group: ""
      kind: Secret
      name: nextcloud-canary-accept-tls
