---
# Argo CD Application for emberstack/reflector — cross-namespace Secret replication.
# Used to distribute the cert-manager wildcard-openwoo-tls Secret into WOO tenant
# namespaces (see cert-manager/wildcard-openwoo-certificate.yaml).
#
# VERIFY THE CHART VERSION before first sync: check the latest stable at
#   https://github.com/emberstack/kubernetes-reflector/releases
# and pin it below. A wrong pin just makes this Application fail to sync (no blast
# radius), but it will not deploy until corrected.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reflector
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: cluster-infra
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cluster-infra

  sources:
    - repoURL: "https://emberstack.github.io/helm-charts"
      chart: reflector
      targetRevision: "7.1.288"   # VERIFY — see comment above
      helm:
        releaseName: reflector
        valueFiles:
          - "$values/reflector/values.yaml"
    - repoURL: "https://codeberg.org/Conduction/cluster-infra.git"
      targetRevision: HEAD
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: reflector

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m

  revisionHistoryLimit: 5
