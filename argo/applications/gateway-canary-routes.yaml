---
# TIJDELIJK — de drie canary-HTTPRoutes plus de ReferenceGrant die de Gateway
# het TLS-secret van canary-accept laat lezen.
#
# Eigen Application, en niet samengevoegd met envoy-gateway-config, om twee
# redenen: terugdraaien van een canary moet één handeling zijn, en deze
# objecten hebben een eindige levensduur. Zodra de batch-migratie begint
# verhuizen de routes naar de generators in Nextcloud-base en react-base en
# verdwijnt deze Application inclusief de twee tenant-namespaces uit de
# destinations van het AppProject.
#
# De routes lopen naast de bestaande Ingresses. Er verandert niets voor
# bestaand verkeer tot een DNS-record verhuist.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-canary-routes
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: cluster-infra
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cluster-infra

  source:
    repoURL: "https://github.com/ConductionNL/cluster-infra.git"
    targetRevision: HEAD
    path: envoy-gateway/canary-routes
    directory:
      recurse: false

  destination:
    server: https://kubernetes.default.svc
    # Elk manifest zet zijn eigen namespace; dit is alleen de fallback.
    namespace: envoy-gateway-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false   # tenant-namespaces bestaan al
      - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m

  revisionHistoryLimit: 5
