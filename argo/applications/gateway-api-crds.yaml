---
# Gateway API + Envoy Gateway CustomResourceDefinitions.
#
# Gevendord uit de gepinde chart gateway-helm 1.8.3 (Gateway API bundle v1.5.1)
# in plaats van meegeleverd door de chart zelf: zie gateway-api/README.md voor de
# herkomst, de sha256 en de bump-procedure. De chart draait daarom met
# crds.enabled=false, zodat er precies één eigenaar van deze objecten is.
#
# Bootstrap-volgorde is niet vrij: deze Application eerst en Synced/Healthy
# afwachten, daarna envoy-gateway (controller) en pas dan envoy-gateway-config
# (GatewayClass/Gateway) — die laatste faalt op ontbrekende types.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: cluster-infra
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cluster-infra

  source:
    repoURL: "https://github.com/ConductionNL/cluster-infra.git"
    targetRevision: HEAD
    path: gateway-api/crds
    directory:
      recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system

  syncPolicy:
    automated:
      # prune BEWUST uit: een CRD verwijderen wist in één keer élk object van
      # dat type — alle Gateways en HTTPRoutes tegelijk. Dat is een aparte,
      # bewuste handeling van een mens, geen neveneffect van een sync.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      # De CRD's zijn samen ~3,6 MB en overschrijden ruim de 256 kB-limiet op
      # de last-applied-configuration-annotatie. Zelfde reden als bij
      # external-secrets en argocd.
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m

  revisionHistoryLimit: 5
