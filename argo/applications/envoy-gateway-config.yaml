---
# Envoy Gateway CONFIG — GatewayClass, de gedeelde Gateway, de EnvoyProxy met
# de loadbalancer-annotaties en de PROXY-protocol-policy.
#
# Gescheiden van de Application envoy-gateway (de controller) om dezelfde reden
# als cert-manager-config: de operator komt uit een upstream chart, de
# configuratie is van ons en moet los reviewbaar en los terugdraaibaar zijn.
#
# Vereist dat gateway-api-crds en envoy-gateway al Synced/Healthy zijn; anders
# faalt de sync op onbekende types. Argo probeert het drie keer opnieuw.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway-config
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: cluster-infra
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cluster-infra

  source:
    repoURL: "https://github.com/ConductionNL/cluster-infra.git"
    targetRevision: HEAD
    path: envoy-gateway/config
    directory:
      recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false   # namespace komt van de twee Applications hierboven
      - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m

  revisionHistoryLimit: 5
