---
# External Secrets Operator — cluster-wide secrets controller + CRDs.
#
# Lives in cluster-infra (like external-dns / cert-manager) because it is a
# cluster capability, not an app-platform concern: Nextcloud-base, react-base
# and others all consume it. App platforms own only their *consumers*
# (ClusterSecretStore / ExternalSecret), not the operator.
#
# Pattern mirrors external-dns.yaml: upstream Helm chart + this repo's values.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: cluster-infra
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cluster-infra

  sources:
    # External Secrets Operator Helm chart (installs the controller + CRDs).
    - repoURL: "https://charts.external-secrets.io"
      chart: external-secrets
      # TODO(before 17:00 deploy): confirm/bump to the current stable tag at
      # https://github.com/external-secrets/external-secrets/releases — pin, never "latest".
      targetRevision: "0.10.5"
      helm:
        releaseName: external-secrets
        valueFiles:
          - "$values/external-secrets/values.yaml"

    # Values from this repo.
    - repoURL: "https://codeberg.org/Conduction/cluster-infra.git"
      targetRevision: HEAD
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      # CRDs from the chart can exceed the annotation size limit; ServerSideApply
      # avoids the last-applied-configuration bloat on the big CRDs.
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m

  revisionHistoryLimit: 5
