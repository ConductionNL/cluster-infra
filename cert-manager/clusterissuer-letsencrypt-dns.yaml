---
# DNS-01 ClusterIssuer for wildcard certificates (Let's Encrypt production).
#
# HTTP-01 (the existing `letsencrypt-prod` issuer) cannot issue wildcards, so this
# issuer uses the DNS-01 Cloudflare solver. It reuses the SAME Cloudflare API token
# that external-dns already uses (Zone:DNS:Edit on openwoo.app) — but cert-manager
# reads DNS-01 secrets from ITS OWN namespace, so `cloudflare-credentials` must exist
# in the `cert-manager` namespace (see bootstrap in README / CHANGELOG).
#
# NOTE: the Cloudflare token needs Zone:Read in ADDITION to DNS:Edit — DNS-01 does a
# zone lookup. Verify the token scope before relying on this.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: robert@conduction.nl
    privateKeySecretRef:
      name: letsencrypt-dns-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-credentials
              key: api-token
        selector:
          dnsZones:
            - "openwoo.app"
            # commonground.nu erbij voor het Nextcloud-wildcard. Zelfde token,
            # zelfde solver. Bewijs dat het token deze zone aankan zonder hem te
            # hoeven lezen: external-dns bezit er TXT-eigenaarsrecords
            # (`heritage=external-dns,...owner=conduction-cluster` op
            # canary.accept.commonground.nu, gemeten 2026-08-18). Een record
            # schrijven vereist eerst een zone-lookup, dus Zone:Read én DNS:Edit
            # zijn beide aantoonbaar aanwezig — precies wat DNS-01 vraagt.
            - "commonground.nu"
